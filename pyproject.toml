[project]
name = "locali"
version = "0.1.0"
description = "Efficient small language models for software engineering, testing and DevOps"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bandit>=1.9.4",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "mcp>=1.30.0",
    "mlflow>=3.17.1",
    "radon>=6.0.1",
    "ruff>=0.16.7",
    "semgrep>=1.136.0",
    "setuptools<81",  # semgrep telemetry still imports pkg_resources
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "httpx>=0.28.1",
    "pytest-timeout>=2.4.0",
]
merge = [
    "accelerate>=1.15.0",
    "peft>=0.21.2",
    "protobuf>=4.25.9",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Result folders hold frozen copies of the scripts that produced them.
# ...and notebooks generated by training/kaggle/build_notebook.py.
extend-exclude = ["experiments/results", "training/kaggle/**/*.ipynb", "demo_repo"]

[tool.ruff.lint.per-file-ignores]
# Spike/job scripts deliberately catch every exception so one failure is recorded, not fatal.
"training/kaggle/**" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["evaluation", "backend", "security", "mcp_servers", "training"]
pythonpath = ["."]
timeout = 900  # a hung test (e.g. an endless stream) fails instead of stalling the suite

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
