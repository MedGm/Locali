[project]
name = "locali"
version = "0.1.0"
description = "Efficient small language models for software engineering, testing and DevOps"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "mcp>=1.30.0",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Result folders hold frozen copies of the scripts that produced them.
extend-exclude = ["experiments/results"]

[tool.ruff.lint.per-file-ignores]
# Spike/job scripts deliberately catch every exception so one failure is recorded, not fatal.
"training/kaggle/**" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["evaluation", "backend", "security", "mcp_servers"]
pythonpath = ["."]
