# Pinned model versions. Change a revision only on purpose, and note why in the commit.
# Snapshot taken 2026-09-15.

main:
  # Dense transformer, code-specialized, widest kernel support (T4, vLLM, llama.cpp, Unsloth).
  # Promotion rule: if Qwen3.5-2B passes the W1 T4 spikes AND beats this model on the W2
  # baseline, it becomes the main model.
  id: qwen2.5-coder-1.5b
  hf_repo: Qwen/Qwen2.5-Coder-1.5B-Instruct
  revision: 2e1fd397ee46e1388853d2af2c993145b0f1098a
  params_b: 1.54
  license: apache-2.0
  architecture: dense (28 layers, GQA 2 KV heads)
  gguf:
    repo: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
    revision: f86cb2c1fa58255f8052cc32aeede1b7482d4361
    q4_k_m: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
    q8_0: qwen2.5-coder-1.5b-instruct-q8_0.gguf

candidates:
