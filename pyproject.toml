[project]
name = "locali"
version = "0.1.0"
description = "Efficient small language models for software engineering, testing and DevOps"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Spike/job scripts deliberately catch every exception so one failure is recorded, not fatal.
"training/kaggle/**" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["evaluation", "backend", "security"]
